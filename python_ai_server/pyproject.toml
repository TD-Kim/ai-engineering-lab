[project]
name = "ai-server"
version = "0.1.0"
description = "AI Engineering Learning Lab — Python AI 서버 (RAG·GraphRAG)"
requires-python = ">=3.12"
# 필요한 라이브러리는 기능을 만들 때 하나씩 추가한다 (기획서 §6-2 참고).
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
